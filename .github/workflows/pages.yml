name: Pages
# From the site repositories made by sites@AgentiCCells.dinis (2026-11-16). In the
# template itself (.factory-template exists) nothing is deployed: it is built,
# checked and versioned only. A seeded site deploys on every push to dev.
on:
  push:
    branches: [dev]
  workflow_dispatch:
  # No timer: every run starts from a commit (Dinis, 19 Nov 2026, ~01:20 UTC; PrompTugal__News__Website
  # board/guidance/2026-11-19-every-run-starts-from-a-commit.md). workflow_dispatch is for a person by hand only.
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # Major and minor are set here by a person. The patch number is set by this workflow only:
  # the first release is v0.1.0, and each later push to dev adds one.
  VERSION_BASE: '0.1'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No release during a hold
        run: if [ -e board/HOLD.md ]; then echo "board/HOLD.md exists" >&2; exit 1; fi
      - id: version
        name: Work out the next version from the tags
        run: |
          last=$(git tag --list "v${VERSION_BASE}.*" | sed "s/^v${VERSION_BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then next=0; else next=$((last + 1)); fi
          echo "version=v${VERSION_BASE}.${next}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION_BASE}.${next}"
      - id: mode
        name: Deploy unless this is the template itself
        run: if [ -e .factory-template ]; then echo deploy=false >> "$GITHUB_OUTPUT"; else echo deploy=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-leak-scan.mjs
      - run: node scripts/test-obs-tz.mjs
      - run: node scripts/test-sites-bar.mjs
      - run: node scripts/test-svg-check.mjs
      - run: node scripts/test-rounds.mjs
      - run: node scripts/test-check-commits.mjs
      - run: node scripts/test-workflow.mjs
      - run: node scripts/build.mjs
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - name: The preview as PNG at 2x (640 by 360), for social cards (headless Chrome on the runner; skipped if absent)
        run: |
          c=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -n "$c" ]; then "$c" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=320,180 --force-device-scale-factor=2 --screenshot="$PWD/_site/preview.png" "file://$PWD/_site/preview.svg" || echo "preview.png not made"; else echo "no Chrome: preview.png not made"; fi
      - run: node scripts/validate.mjs
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  checks:
    # security@'s controls 7 to 9 (fourth and fifth rulings, 948820a7e and 16402a95c, relayed by conductor.b@ at 14:17 and
    # 14:20 UTC, 19 Nov 2026). This job runs no pushed code: every run line is in this file, and the checks run from the
    # anchor A's tree, copied into RUNNER_TEMP. A is read from GitHub's record (the head_sha of the latest successful push
    # run of this workflow on dev; sixth ruling), never from git, a tag or a deployment, and must be an ancestor of AFTER. The range is
    # A..AFTER. The build output reaches this job only as data (the Pages artifact, unpacked into _site/). GITHUB_ENV and
    # GITHUB_PATH written by the build job do not reach it: those files are per job, and it reads no build outputs.
    # Limit: this YAML comes from the pushed tree; only Dinis's branch protection with a required check closes that.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GIT_NO_REPLACE_OBJECTS: '1'
      NODE_OPTIONS: ''
      AFTER: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages
      - name: Unpack the built site as data, before any trusted copy exists (events.b@'s finding, 14:30 UTC)
        # The listing is vetted first: plain files and directories only, no absolute names, no "..". The deployed
        # artifact is the one scanned. The trusted copies are written only after this, and symlinks are checked again.
        run: |
          T="$RUNNER_TEMP/pages/artifact.tar"
          bad=$(tar -tvf "$T" | awk '{ t = substr($1, 1, 1); if (t != "-" && t != "d") print }')
          [ -z "$bad" ] || { echo "the Pages artifact holds a member that is not a plain file or directory" >&2; exit 1; }
          if tar -tf "$T" | grep -qE '^/|(^|/)\.\.(/|$)'; then echo "the Pages artifact holds an absolute or .. name" >&2; exit 1; fi
          rm -rf _site && mkdir _site
          tar -xf "$T" -C _site --no-same-owner --no-same-permissions
          [ -z "$(find _site -type l -print -quit)" ] || { echo "the built site holds a symlink" >&2; exit 1; }
      - name: The anchor A, from GitHub's record of passed runs
        # security@'s sixth ruling (0ba439611, relayed by conductor.b@ at 14:26 UTC, 19 Nov 2026): A is the head_sha of
        # the latest run of this workflow file on dev, event push, conclusion success. Only GitHub Actions creates runs;
        # anyone with write access can make a deployment (civic.b@'s finding), so none is read here.
        id: anchor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          A=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?branch=dev&event=push&status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/pages.yml" and .head_branch == "dev" and .event == "push" and .conclusion == "success")][0].head_sha // ""')
          [[ "$A" =~ ^[0-9a-f]{40}$ ]] || { echo "no successful push run of this workflow on dev: no verified anchor" >&2; exit 1; }
          git merge-base --is-ancestor "$A" "$AFTER" || { echo "anchor $A is not an ancestor of $AFTER" >&2; exit 1; }
          echo "a=$A" >> "$GITHUB_OUTPUT"
          echo "node=$(readlink -f "$(command -v node)")" >> "$GITHUB_OUTPUT"
          echo "anchor: $A"
      - name: The checks from A's tree, into RUNNER_TEMP (symlinks refused)
        env:
          A: ${{ steps.anchor.outputs.a }}
        run: |
          [ "$(git ls-tree "$A" scripts/trusted-checks.sh | cut -c1-6)" = "100644" ] || { echo "anchor $A has no plain scripts/trusted-checks.sh" >&2; exit 1; }
          git show "$A:scripts/trusted-checks.sh" > "$RUNNER_TEMP/trusted-checks.sh"
          /usr/bin/bash "$RUNNER_TEMP/trusted-checks.sh" "$A" "$AFTER" "$RUNNER_TEMP/trusted"
      - name: Every commit in A..AFTER carries an Agent trailer
        env:
          A: ${{ steps.anchor.outputs.a }}
          NODE: ${{ steps.anchor.outputs.node }}
        run: '"$NODE" "$RUNNER_TEMP/trusted/check-commits.mjs" "$A" "$AFTER"'
      - name: Leak scan of the tracked files and the built site, from A's copy (symlinks checked again)
        env:
          NODE: ${{ steps.anchor.outputs.node }}
        run: |
          [ -z "$(find _site -type l -print -quit)" ] || { echo "the built site holds a symlink" >&2; exit 1; }
          "$NODE" "$RUNNER_TEMP/trusted/leak-scan.mjs" --root "$GITHUB_WORKSPACE"
  deploy:
    needs: [build, checks]
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  tag:
    needs: [build, checks, deploy]
    if: ${{ always() && needs.build.result == 'success' && needs.checks.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"

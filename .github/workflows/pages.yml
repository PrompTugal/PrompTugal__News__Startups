name: Pages
# From the site repositories made by sites@AgentiCCells.dinis (2026-11-16). In the
# template itself (.factory-template exists) nothing is deployed: it is built,
# checked and versioned only. A seeded site deploys on every push to dev.
on:
  push:
    branches: [dev]
  workflow_dispatch:
  # No timer: every run starts from a commit (Dinis, 19 Nov 2026, ~01:20 UTC; PrompTugal__News__Website
  # board/guidance/2026-11-19-every-run-starts-from-a-commit.md). workflow_dispatch is for a person by hand only.
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # Major and minor are set here by a person. The patch number is set by this workflow only:
  # the first release is v0.1.0, and each later push to dev adds one.
  VERSION_BASE: '0.1'
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No release during a hold
        run: if [ -e board/HOLD.md ]; then echo "board/HOLD.md exists" >&2; exit 1; fi
      - id: version
        name: Work out the next version from the tags
        run: |
          last=$(git tag --list "v${VERSION_BASE}.*" | sed "s/^v${VERSION_BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then next=0; else next=$((last + 1)); fi
          echo "version=v${VERSION_BASE}.${next}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION_BASE}.${next}"
      - id: mode
        name: Deploy unless this is the template itself
        run: if [ -e .factory-template ]; then echo deploy=false >> "$GITHUB_OUTPUT"; else echo deploy=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every commit since the last release carries an Agent trailer
        # From the last release tag, not github.event.before: GitHub drops a pending run when a
        # newer one queues, and the surviving run's "before" is the dropped push's head, so the
        # dropped push's commits were never checked (specialist.code@ finding 3b).
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        # security@'s control 7 (third ruling, 19 Nov 2026): the security checks and their config come from BEFORE,
        # never from the pushed tree, and the run fails when BEFORE is missing, is not an ancestor of AFTER, or has no
        # copy (scripts/trusted-checks.sh). They go into .trusted/ (ignored by git), so each one's root is this checkout.
        # The range still starts at the last release tag reachable from BEFORE, so a dropped run's commits are checked.
        run: |
          bash scripts/trusted-checks.sh "$BEFORE" "$AFTER" .trusted
          last=$(git describe --tags --abbrev=0 --match "v${VERSION_BASE}.*" "$BEFORE" 2>/dev/null || true)
          node .trusted/check-commits.mjs "${last:-$BEFORE}" "$AFTER"
      - run: node scripts/test-leak-scan.mjs
      - run: node scripts/test-obs-tz.mjs
      - run: node scripts/test-sites-bar.mjs
      - run: node scripts/test-svg-check.mjs
      - run: node scripts/test-rounds.mjs
      - run: node scripts/test-check-commits.mjs
      - run: node scripts/build.mjs
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - name: The preview as PNG at 2x (640 by 360), for social cards (headless Chrome on the runner; skipped if absent)
        run: |
          c=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -n "$c" ]; then "$c" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=320,180 --force-device-scale-factor=2 --screenshot="$PWD/_site/preview.png" "file://$PWD/_site/preview.svg" || echo "preview.png not made"; else echo "no Chrome: preview.png not made"; fi
      - run: node scripts/validate.mjs
      - name: Leak scan (tracked files and the built site), from the last release's copy
        run: node .trusted/leak-scan.mjs
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  tag:
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
